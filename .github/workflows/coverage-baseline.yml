name: Coverage baseline

# Runs coverage against `main` so drift after a merge stays visible.
# Runs weekly (Monday 06:00 America/New_York,
# matching dependabot.yml; 11:00 UTC) and on demand. It replaces the old
# `push: branches: [main]` trigger on ci.yml, which re-ran the full matrix
# after every merge. Scheduled runs always use the default branch.

on:
  schedule:
    - cron: '0 11 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Tests with coverage
        run: |
          pytest -q --cov=shimkit \
            --cov-report=term \
            --cov-report=xml:coverage.xml
      - name: Coverage summary
        if: always() && hashFiles('coverage.xml') != ''
        run: python scripts/coverage_summary.py
      - name: Keep coverage.xml
        if: always() && hashFiles('coverage.xml') != ''
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml-${{ github.sha }}
          path: coverage.xml
          retention-days: 7
